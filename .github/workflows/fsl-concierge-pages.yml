name: Deploy FSL Concierge to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'fsl-concierge/**'
      - '.github/workflows/fsl-concierge-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fsl-concierge-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload FSL Concierge site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './fsl-concierge'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
