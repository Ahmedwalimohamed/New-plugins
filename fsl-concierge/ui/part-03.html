details class="card pad settingsblock"><summary><span>Trusted source emails</span><span id="sourceTag" class="tag">0 active</span></summary><div class="settingsbody"><form id="sourceForm" class="formgrid"><div class="field"><label>Email address</label><input id="sourceEmail" type="email" required placeholder="stakeholder@example.org"></div><div class="field"><label>Name</label><input id="sourceName" placeholder="Optional"></div><div class="field"><label>Organisation / role</label><input id="sourceOrg" placeholder="Partner, consultant, finance"></div><button class="btn" type="submit">Add source</button></form><div id="emailSources" class="sourcegrid"><div class="empty">Loading source emails…</div></div></div></details>
        <div class="card pad"><div class="sectionhead"><div><h3>Source-of-truth rule</h3><p>The Concierge should produce work from connected email accounts, trusted correspondents, uploaded documents, and verified project memory—not generic assumptions.</p></div><span class="tag good">ENFORCED</span></div></div>
      </section>
    </main>
  </div>
</div>

<div class="mobilebar">
  <button class="active" data-page="home">Home</button><button data-page="tasks">Tasks</button><button data-page="documents">Docs</button><button data-page="projects">Project</button><button data-page="settings">Sources</button>
</div>
<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={items:[],memory:[],sync:null,reports:[],documents:[],emailSources:[],emailAccounts:[],profile:null,emailOAuth:{}};

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2400)}
function when(x){if(!x)return'—';try{return new Intl.DateTimeFormat('en',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(x))}catch{return x}}
function dateParts(x){try{const d=new Date(x);return{day:new Intl.DateTimeFormat('en',{day:'2-digit'}).format(d),mon:new Intl.DateTimeFormat('en',{month:'short'}).format(d)}}catch{return{day:'—',mon:''}}}
function size(n){n=Number(n||0);if(n<1024)return`${n} B`;if(n<1048576)return`${(n/1024).toFixed(1)} KB`;return`${(n/1048576).toFixed(1)} MB`}
async function api(url,opt){const r=await fetch(url,opt);if(r.status===401){location='/login';throw new Error('auth')}return r}
function sourceLink(i,label='Open source'){return i.source_url?`<a class="btn secondary smallbtn link" href="${esc(i.source_url)}" target="_blank" rel="noreferrer">${label}</a>`:''}

function setPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${page}`));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));window.scrollTo({top:0,behavior:'smooth'});if(page==='documents')$('docSearch')?.focus()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('openSettings').onclick=()=>setPage('settings');

async function load(){
  $('refresh').disabled=true;
  try{const r=await api('/api/state',{cache:'no-store'});if(!r.ok)throw new Error('load');state=await r.json();render()}
  catch(e){if(e.message!=='auth')toast('Could not load your secure workspace')}
  finally{$('refresh').disabled=false}
}

function render(){
  const p=state.profile||{};
  $('welcome').textContent=p.full_name?`Good to see you, ${p.full_name.split(' ')[0]}.`:'Your operations workspace';
  $('profileName').textContent=p.full_name||'My workspace';
  $('profileOrg').textContent=[p.job_title,p.organization].filter(Boolean).join(' · ')||'Private evidence workspace';
  $('profileLine').textContent='Here is what needs your attention and what changed across your project evidence.';
  const connected=(state.emailAccounts||[]).filter(a=>a.status==='connected');
  $('mailboxStatus').textContent=connected.length?`${connected.length} email account${connected.length===1?'':'s'} connected · evidence private to you`:'Evidence workspace active · email not connected yet';
  $('lastSync').textContent=state.sync?.last_sync_at?when(state.sync.last_sync_at):'Not available';
  renderAccounts();renderSources();renderDocs();renderWork();renderEvidenceStatus();
}

function renderAccounts(){
  const a=state.emailAccounts||[],connected=a.filter(x=>x.status==='connected');
  $('accountTag').textContent=`${connected.length} connected`;$('accountTag').className='tag '+(connected.length?'good':'warn');
  $('emailAccounts').innerHTML=a.length?a.map(x=>`<div class="accountcard"><div class="rowtop"><div><strong>${esc(x.account_email)}</strong><div class="small muted">${esc(x.label||x.provider)}${x.last_sync_at?' · synced '+esc(when(x.last_sync_at)):''}</div></div><span class="tag ${x.status==='connected'?'good':x.status==='pending'?'warn':'bad'}">${esc(x.status.toUpperCase())}</span></div>${x.status!=='disconnected'?`<div class="actions"><button class="btn secondary smallbtn" onclick="disconnectAccount('${x.id}')">Disconnect</button></div>`:''}</div>`).join(''):'<div class="empty">No email account attached yet.</div>';
  const needsSetup=(!state.emailOAuth?.gmailConfigured&&!state.emailOAuth?.outlookConfigured)&&a.some(x=>x.status==='pending'&&x.provider!=='other');
  $('oauthNote').classList.toggle('hidden',!needsSetup);
  if(needsSetup)$('oauthNote').innerHTML='<b>Provider authorization is not yet enabled.</b> The account is registered, but Google/Microsoft OAuth still needs to be configured before automatic mailbox sync.';
}

function renderSources(){
  const s=state.emailSources||[],active=s.filter(x=>x.is_active);$('sourceTag').textContent=`${active.length} active`;$('sourceTag').className='tag '+(active.length?'good':'');
  $('emailSources').innerHTML=s.length?s.map(x=>`<div class="sourcecard"><div class="rowtop"><div><strong>${esc(x.email)}</strong><div class="small muted">${esc(x.display_name||'Project source')}${x.organization?' · '+esc(x.organization):''}</div></div><span class="tag ${x.is_active?'good':'warn'}">${x.is_active?'ACTIVE':'PAUSED'}</span></div><div class="actions"><button class="btn secondary smallbtn" onclick="toggleSource('${x.id}',${!x.is_active})">${x.is_active?'Pause':'Activate'}</button><button class="btn danger smallbtn" onclick="deleteSource('${x.id}')">Remove</button></div></div>`).join(''):'<div class="empty">No additional trusted source emails yet.</div>';
}

function renderDocs(filter=''){
  const all=state.documents||[],q=filter.trim().toLowerCase(),d=q?all.filter(x=>`${x.file_name||''} ${x.category||''} ${x.description||''}`.toLowerCase().includes(q)):all;
  $('docTag').textContent=q?`$
