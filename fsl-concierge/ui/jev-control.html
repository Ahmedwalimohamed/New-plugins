<style>
.jev-control-card{margin-top:17px}.jev-control-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.jev-route{font-weight:900}.jev-route.green{color:#28704a}.jev-route.amber{color:#8a5a00}.jev-route.red{color:#9d2d23}.jev-route.unavailable{color:#687984}.jev-decision{padding:11px 0;border-top:1px solid var(--line)}.jev-decision:first-child{border-top:0}.jev-gates{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.jev-qa-box{margin:0 0 14px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#f8fafb}.jev-qa-box.green{border-color:#b9ddc8;background:#f4fbf7}.jev-qa-box.amber{border-color:#efd6a2;background:#fff9ed}.jev-qa-box.red{border-color:#e9b9b4;background:#fff7f6}
</style>
<script>
let jevStatus={configured:false,model:'jev-latest'},jevDecisions=[];
const jevRouteLabel=r=>({green:'GREEN · proceed',amber:'AMBER · review',red:'RED · human review',unavailable:'Jev not connected'})[r]||String(r||'unknown');
function jevLatest(entityType,entityId){return jevDecisions.find(d=>d.entity_type===entityType&&d.entity_id===entityId)}
async function jevLoadControl(){
  try{const [sr,dr]=await Promise.all([api('/api/jev/status',{cache:'no-store'}),api('/api/jev/decisions',{cache:'no-store'})]);if(sr.ok)jevStatus=await sr.json();if(dr.ok)jevDecisions=(await dr.json()).decisions||[];jevInstallControl();jevRenderControl();}
  catch(e){if(e.message!=='auth')console.error('Jev control',e)}
}
function jevInstallControl(){
  const page=$('page-tasks');if(!page||$('jevControl'))return;
  const sec=document.createElement('section');sec.id='jevControl';sec.className='card pad jev-control-card';sec.innerHTML=`<div class="jev-control-head"><div><div class="eyebrow muted">Decision control layer</div><h3 style="margin:3px 0">Jev review</h3><p class="muted" style="margin:0">Jev makes bounded decisions; code routes the workflow; you keep consequential approval.</p></div><span id="jevProviderTag" class="tag"></span></div><div id="jevDecisionList" style="margin-top:12px"></div>`;page.appendChild(sec)
}
function jevRenderControl(){
  jevInstallControl();if(!$('jevProviderTag'))return;$('jevProviderTag').textContent=jevStatus.configured?`JEV · ${jevStatus.model||'jev-latest'}`:'JEV · KEY NEEDED';$('jevProviderTag').className='tag '+(jevStatus.configured?'good':'warn');const open=jevDecisions.filter(d=>d.requires_human_review&&!d.human_outcome).slice(0,8);$('jevDecisionList').innerHTML=open.length?open.map(d=>`<div class="jev-decision"><div class="rowtop"><div><b>${esc(String(d.entity_type).replaceAll('_',' '))} · ${esc(String(d.stage).replaceAll('_',' '))}</b><div class="small muted">${esc(when(d.created_at))}${d.confidence!=null?' · '+Math.round(Number(d.confidence)*100)+'% confidence':''}</div></div><span class="jev-route ${esc(d.route)}">${esc(jevRouteLabel(d.route))}</span></div>${(d.gate_reasons||[]).length?`<div class="jev-gates">${d.gate_reasons.map(x=>`<span class="tag">${esc(String(x).replaceAll('_',' '))}</span>`).join('')}</div>`:''}${d.provider_error?`<div class="small muted" style="margin-top:6px">${esc(d.provider_error)}</div>`:''}</div>`).join(''):`<div class="empty">${jevStatus.configured?'No Jev exceptions need your attention.':'The Jev workflow is installed but needs a TypeSafe API key before live decisions can run.'}</div>`
}
async function jevCheck(entityType,entityId,stage='review',quiet=false){
  if(!entityId)return null;try{const r=await api('/api/jev/check',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({entity_type:entityType,entity_id:entityId,stage})}),d=await r.json().catch(()=>({}));if(!r.ok){if(!quiet)toast(d.error||'Jev review failed');return null}if(d.decision){jevDecisions.unshift(d.decision);jevRenderControl()}return d.decision||null}catch(e){if(!quiet)toast('Jev review failed');return null}
}
function jevShowProductDecision(decision){
  if(!decision||!$('jevMeta'))return;let box=$('jevQaBox');if(!box){box=document.createElement('div');box.id='jevQaBox';$('jevMeta').parentElement.insertBefore(box,$('jevMeta').nextSibling)}box.className=`jev-qa-box ${decision.route||'unavailable'}`;box.innerHTML=`<div class="rowtop"><div><b>Jev QA</b><div class="small muted">Bounded semantic check · ${esc(String(decision.stage||'review').replaceAll('_',' '))}</div></div><span class="jev-route ${esc(decision.route)}">${esc(jevRouteLabel(decision.route))}</span></div>${decision.confidence!=null?`<div class="small muted" style="margin-top:5px">Confidence ${Math.round(Number(decision.confidence)*100)}%</div>`:''}${(decision.gate_reasons||[]).length?`<div class="jev-gates">${decision.gate_reasons.map(x=>`<span class="tag">${esc(String(x).replaceAll('_',' '))}</span>`).join('')}</div>`:''}${decision.provider_error?`<div class="small muted" style="margin-top:6px">${esc(decision.provider_error)}</div>`:''}`
}
if(typeof jevRenderBundle==='function'){
  const __jevControlRenderBundle=jevRenderBundle;jevRenderBundle=function(bundle){__jevControlRenderBundle(bundle);const p=bundle?.product,d=p?jevLatest('work_product',p.id):null;if(d)jevShowProductDecision(d);else if($('jevQaBox'))$('jevQaBox').remove()}
}
if(typeof jevStartWork==='function'){
  const __jevControlStart=jevStartWork;jevStartWork=async function(itemId){await __jevControlStart(itemId);const p=jevBundle?.product;if(p){const d=await jevCheck('work_product',p.id,'draft_generated',true);if(d)jevShowProductDecision(d)}}
}
if(typeof jevRevise==='function'){
  const __jevControlRevise=jevRevise;jevRevise=async function(){await __jevControlRevise();const p=jevBundle?.product;if(p){const d=await jevCheck('work_product',p.id,'draft_revised',true);if(d)jevShowProductDecision(d)}}
}
if(typeof jevApprove==='function'){
  const __jevControlApprove=jevApprove;jevApprove=async function(){const p=jevBundle?.product;if(!p)return;const d=await jevCheck('work_product',p.id,'pre_approval',true);if(d){jevShowProductDecision(d);if(d.route==='unavailable'){if(!confirm('Jev is not connected. Continue with your own human review and approval?'))return}else if(d.route==='red'){if(!confirm(`Jev flagged this for human review${(d.gate_reasons||[]).length?': '+d.gate_reasons.join(', '):''}. You remain the decision-maker. Approve anyway?`))return}else if(d.route==='amber'){if(!confirm(`Jev found uncertainty${(d.gate_reasons||[]).length?': '+d.gate_reasons.join(', '):''}. Review the draft carefully. Continue approval?`))return}}await __jevControlApprove()}
}
const __jevControlLoad=load;load=async function(){await __jevControlLoad();await jevLoadControl()};
jevLoadControl();
</script>
