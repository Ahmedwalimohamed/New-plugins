<style>
.setupEngine{margin-bottom:18px}.setupFlow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 16px}.setupStep{padding:7px 10px;border:1px solid #d6e0e5;border-radius:999px;background:#f8fbfc;font-size:11px;font-weight:850;color:#315565}.setupArrow{color:#8aa0aa}.setupRows{display:grid;gap:10px}.setupRow{border:1px solid #e0e7ea;border-radius:12px;padding:14px}.setupRowHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.setupTitle{font-weight:900;font-size:15px}.setupStatus{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.setupDetailGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.setupBox{padding:12px;border:1px solid #e0e7ea;border-radius:10px;background:#fafcfd}.setupBox h5{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#5c7580}.setupModules{display:flex;gap:5px;flex-wrap:wrap}.setupModule{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#e9f6ee;color:#28704a}.setupModule.off{background:#f0f2f3;color:#82919a;text-decoration:line-through}.setupQuestions{margin:7px 0 0;padding-left:18px;color:#76510a}.setupRoute{font-weight:900}.setupRoute.green{color:#28704a}.setupRoute.amber{color:#946000}.setupRoute.red{color:#9d2d23}.setupRoute.unavailable{color:#687984}.setupModal{position:fixed;inset:0;background:#071923a8;display:none;align-items:center;justify-content:center;padding:24px;z-index:50}.setupModal.open{display:flex}.setupModalCard{width:min(900px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;border:1px solid #d8e1e5;box-shadow:0 24px 70px #07192340}.setupModalHead{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4eaed;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;z-index:2}.setupModalBody{padding:18px}.setupFacts{display:grid;gap:9px}.setupFact{padding:10px 12px;border:1px solid #e4eaed;border-radius:9px}.setupFact b{display:block;margin-bottom:3px}.setupClose{border:1px solid #ccd8de;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:800}@media(max-width:700px){.setupDetailGrid{grid-template-columns:1fr}.setupRowHead{flex-direction:column}}
</style>
<script>
(()=>{
let setupState={responses:[],maps:[],decisions:[],profiles:[],jev_configured:false};
const setupEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setupLatest=(rows,id,key='assessment_response_id')=>(rows||[]).find(x=>x[key]===id);
function setupInstall(){
  if(document.getElementById('setupEngine'))return;const anchor=document.querySelector('.assessment');if(!anchor)return;
  const sec=document.createElement('section');sec.id='setupEngine';sec.className='card pad setupEngine';sec.innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Concierge Setup Engine</div><h3>Assessment → Workflow Map → Jev → Setup</h3><div class="small muted">Turn each submitted assessment into a structured workflow model, let Jev evaluate bounded setup decisions, then let the admin approve the proposed Concierge.</div></div><span id="setupJevBadge" class="pill">JEV</span></div><div class="setupFlow"><span class="setupStep">1 · Submitted assessment</span><span class="setupArrow">→</span><span class="setupStep">2 · Workflow Map</span><span class="setupArrow">→</span><span class="setupStep">3 · Jev evaluation</span><span class="setupArrow">→</span><span class="setupStep">4 · Concierge Setup</span><span class="setupArrow">→</span><span class="setupStep">5 · Admin approval</span></div><div id="setupRows" class="setupRows"><div class="empty">Loading setup engine…</div></div>`;anchor.insertAdjacentElement('afterend',sec);
  const modal=document.createElement('div');modal.id='setupModal';modal.className='setupModal';modal.innerHTML='<div class="setupModalCard"><div class="setupModalHead"><div><b id="setupModalTitle">Workflow setup</b><div id="setupModalSub" class="small muted"></div></div><button class="setupClose" onclick="window.closeSetupModal()">Close</button></div><div id="setupModalBody" class="setupModalBody"></div></div>';document.body.appendChild(modal);
}
async function setupLoad(){setupInstall();try{const r=await fetch('/api/admin/setup-engine',{cache:'no-store'});if(r.status===401)return;if(!r.ok)throw 0;setupState=await r.json();setupRender()}catch{const e=document.getElementById('setupRows');if(e)e.innerHTML='<div class="empty">Could not load the Concierge Setup Engine.</div>'}}
function setupRender(){
  setupInstall();const badge=document.getElementById('setupJevBadge');if(badge){badge.textContent=setupState.jev_configured?'JEV · CONNECTED':'JEV · NOT CONNECTED';badge.className='pill '+(setupState.jev_configured?'good':'warn')}
  const rows=document.getElementById('setupRows');if(!rows)return;const responses=(setupState.responses||[]).filter(r=>!/^test\b/i.test(String(r.name||'').trim()));
  rows.innerHTML=responses.length?responses.map(r=>{const map=setupLatest(setupState.maps,r.id),profile=setupLatest(setupState.profiles,r.id),decision=profile?.jev_decision_id?(setupState.decisions||[]).find(d=>d.id===profile.jev_decision_id):setupLatest(setupState.decisions,r.id);const route=decision?.route||null,mods=profile?.setup_config?.modules||[],questions=profile?.setup_config?.clarification_questions||decision?.clarification_questions||[];return `<div class="setupRow"><div class="setupRowHead"><div><div class="setupTitle">${setupEsc(r.name)}</div><div class="small muted">${setupEsc(r.job_title||'Role not provided')}${r.organisation?' · '+setupEsc(r.organisation):''}</div><div class="setupStatus"><span class="pill ${map?'good':''}">${map?'Workflow map ready':'Assessment submitted'}</span>${route?`<span class="pill ${route==='green'?'good':route==='red'?'bad':'warn'}">Jev ${setupEsc(route.toUpperCase())}</span>`:''}${profile?`<span class="pill ${profile.status==='approved'?'good':profile.status==='needs_clarification'?'warn':''}">${setupEsc(profile.status.replaceAll('_',' '))}</span>`:''}</div></div><div class="actions" style="margin-top:0"><button class="btn small" onclick="window.generateSetup('${r.id}',this)">${profile?'Regenerate':'Generate workflow map'}</button>${profile?`<button class="btn secondary small" onclick="window.viewSetup('${r.id}')">Review setup</button>`:''}${profile&&profile.status!=='approved'?`<button class="btn secondary small" onclick="window.approveSetup('${profile.id}',this)">Approve setup</button>`:''}</div></div>${profile?`<div class="setupDetailGrid"><div class="setupBox"><h5>Jev evaluation</h5><div class="setupRoute ${setupEsc(route||'unavailable')}">${setupEsc((route||'unavailable').toUpperCase())}${decision?.confidence!=null?' · '+Math.round(Number(decision.confidence)*100)+'% confidence':''}</div>${(decision?.gate_reasons||[]).length?`<div class="small muted" style="margin-top:5px">${setupEsc(decision.gate_reasons.join(' · ').replaceAll('_',' '))}</div>`:''}${questions.length?`<ul class="setupQuestions">${questions.map(q=>`<li>${setupEsc(q)}</li>`).join('')}</ul>`:''}</div><div class="setupBox"><h5>Proposed modules</h5><div class="setupModules">${mods.map(m=>`<span class="setupModule ${m.enabled?'':'off'}">${setupEsc(m.label)}</span>`).join('')}</div></div></div>`:''}</div>`}).join(''):'<div class="empty">No real assessment submissions are available yet. Test submissions are excluded from setup generation.</div>';
}
window.generateSetup=async(id,btn)=>{btn.disabled=true;btn.textContent='Generating…';try{const r=await fetch(`/api/admin/setup-engine/${id}/generate`,{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Generation failed');if(window.toast)toast('Workflow Map, Jev evaluation and setup generated');await setupLoad();window.viewSetup(id)}catch(e){if(window.toast)toast(e.message||'Generation failed');else alert(e.message)}finally{btn.disabled=false}};
window.approveSetup=async(id,btn)=>{if(!confirm('Approve this proposed Concierge setup? This records the configuration as approved; it does not silently create missing integrations or permissions.'))return;btn.disabled=true;try{const r=await fetch(`/api/admin/setup-engine/${id}/approve`,{method:'POST',headers:{'content-type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Approval failed');if(window.toast)toast('Concierge setup approved');await setupLoad()}catch(e){if(window.toast)toast(e.message||'Approval failed')}finally{btn.disabled=false}};
window.viewSetup=id=>{const r=(setupState.responses||[]).find(x=>x.id===id),map=setupLatest(setupState.maps,id),profile=setupLatest(setupState.profiles,id),decision=profile?.jev_decision_id?(setupState.decisions||[]).find(d=>d.id===profile.jev_decision_id):setupLatest(setupState.decisions,id);if(!r||!map||!profile)return;document.getElementById('setupModalTitle').textContent=`${r.name} · Concierge Setup`;document.getElementById('setupModalSub').textContent=`${r.job_title||''}${r.organisation?' · '+r.organisation:''}`;const wm=map.workflow_map||{},cfg=profile.setup_config||{},mods=cfg.modules||[];document.getElementById('setupModalBody').innerHTML=`<div class="setupDetailGrid"><div class="setupBox"><h5>Workflow Map</h5><div class="setupFacts"><div class="setupFact"><b>Role & responsibilities</b>${setupEsc(wm.role_context?.responsibilities||'—')}</div><div class="setupFact"><b>Recurring work</b>${setupEsc(wm.recurring_work?.repetitive_tasks||'—')}</div><div class="setupFact"><b>Email work</b>${setupEsc(wm.work_sources?.email_work||'—')}</div><div class="setupFact"><b>Reports & outputs</b>${setupEsc(wm.outputs?.reports||'—')}</div><div class="setupFact"><b>Deadlines</b>${setupEsc(wm.deadlines?.tracking_problem||'—')}</div><div class="setupFact"><b>Desired automation</b>${setupEsc(wm.desired_automation?.assistant_tasks||wm.desired_automation?.eliminate_task||'—')}</div></div></div><div class="setupBox"><h5>Jev → Concierge Setup</h5><div class="setupRoute ${setupEsc(decision?.route||'unavailable')}">${setupEsc((decision?.route||'unavailable').toUpperCase())}${decision?.confidence!=null?' · '+Math.round(Number(decision.confidence)*100)+'% confidence':''}</div><div class="small muted" style="margin:5px 0 12px">Work pattern: ${setupEsc(cfg.work_pattern||'—')}</div><div class="setupModules">${mods.map(m=>`<span class="setupModule ${m.enabled?'':'off'}">${setupEsc(m.label)}</span>`).join('')}</div><h5 style="margin-top:16px">Human controls</h5><div class="small">External send approval: <b>Required</b><br>Financial/beneficiary decisions: <b>Authorised human required</b><br>Project evidence isolation: <b>${cfg.evidence_policy?.project_isolation?'On':'Not required by assessment'}</b></div>${(cfg.clarification_questions||[]).length?`<h5 style="margin-top:16px">Clarification needed</h5><ul class="setupQuestions">${cfg.clarification_questions.map(q=>`<li>${setupEsc(q)}</li>`).join('')}</ul>`:''}</div></div>`;document.getElementById('setupModal').classList.add('open')};
window.closeSetupModal=()=>document.getElementById('setupModal')?.classList.remove('open');
setupInstall();setupLoad();document.getElementById('refresh')?.addEventListener('click',()=>setTimeout(setupLoad,100));
})();
</script>
