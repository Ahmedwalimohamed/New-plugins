<style>
.setupEngine{margin-bottom:18px}.setupFlow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 16px}.setupStep{padding:7px 10px;border:1px solid #d6e0e5;border-radius:999px;background:#f8fbfc;font-size:11px;font-weight:850;color:#315565}.setupArrow{color:#8aa0aa}.setupRows{display:grid;gap:10px}.setupRow{border:1px solid #e0e7ea;border-radius:12px;padding:14px}.setupRowHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.setupTitle{font-weight:900;font-size:15px}.setupStatus{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.setupDetailGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.setupBox{padding:12px;border:1px solid #e0e7ea;border-radius:10px;background:#fafcfd}.setupBox h5{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#5c7580}.setupModules{display:flex;gap:5px;flex-wrap:wrap}.setupModule{font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#e9f6ee;color:#28704a}.setupModule.off{background:#f0f2f3;color:#82919a;text-decoration:line-through}.setupQuestions{margin:7px 0 0;padding-left:18px;color:#76510a}.setupRoute{font-weight:900}.setupRoute.green{color:#28704a}.setupRoute.amber{color:#946000}.setupRoute.red{color:#9d2d23}.setupRoute.unavailable{color:#687984}.setupLink{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:11px;border:1px solid #e0e7ea;border-radius:10px;background:#fbfcfd}.setupLink select,.setupLink input{min-width:220px;padding:8px 10px;border:1px solid #ccd8de;border-radius:8px;background:#fff}.setupContact{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.setupModal{position:fixed;inset:0;background:#071923a8;display:none;align-items:center;justify-content:center;padding:24px;z-index:50}.setupModal.open{display:flex}.setupModalCard{width:min(900px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;border:1px solid #d8e1e5;box-shadow:0 24px 70px #07192340}.setupModalHead{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4eaed;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;z-index:2}.setupModalBody{padding:18px}.setupFacts{display:grid;gap:9px}.setupFact{padding:10px 12px;border:1px solid #e4eaed;border-radius:9px}.setupFact b{display:block;margin-bottom:3px}.setupClose{border:1px solid #ccd8de;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:800}.setupLegacy{color:#946000;font-size:11px;font-weight:800}.setupInvite{margin-top:8px;font-size:12px}.setupInvite.good{color:#28704a}.setupInvite.warn{color:#946000}@media(max-width:700px){.setupDetailGrid{grid-template-columns:1fr}.setupRowHead{flex-direction:column}.setupLink input,.setupLink select{min-width:100%;width:100%}}
</style>
<script>
(()=>{
let setupState={responses:[],maps:[],decisions:[],profiles:[],users:[],candidateResponses:[],invitations:[],jev_configured:false,email_delivery_configured:false};
const setupEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setupLatest=(rows,id,key='assessment_response_id')=>(rows||[]).find(x=>x[key]===id);
const setupWorker=(profile,map)=>{const id=profile?.worker_user_id||map?.worker_user_id;return(setupState.users||[]).find(u=>u.id===id)||null};
const candidateFor=id=>(setupState.candidateResponses||[]).find(x=>x.id===id)||null;
const inviteFor=id=>(setupState.invitations||[]).find(x=>x.assessment_response_id===id)||null;
function setupInstall(){
  if(document.getElementById('setupEngine'))return;const anchor=document.querySelector('.assessment');if(!anchor)return;
  const sec=document.createElement('section');sec.id='setupEngine';sec.className='card pad setupEngine';sec.innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Universal Concierge Setup Engine</div><h3>Assessment → Workflow Map → Jev → Approve & Invite</h3><div class="small muted">The assessment creates the worker blueprint. Admin approval provisions the Concierge; the worker then creates their own password and authorizes their own email and evidence sources.</div></div><span id="setupJevBadge" class="pill">JEV</span></div><div class="setupFlow"><span class="setupStep">1 · Assessment</span><span class="setupArrow">→</span><span class="setupStep">2 · Workflow Map</span><span class="setupArrow">→</span><span class="setupStep">3 · Jev</span><span class="setupArrow">→</span><span class="setupStep">4 · Proposed setup</span><span class="setupArrow">→</span><span class="setupStep">5 · Admin approval</span><span class="setupArrow">→</span><span class="setupStep">6 · Worker activation</span><span class="setupArrow">→</span><span class="setupStep">7 · Connect sources</span></div><div id="setupRows" class="setupRows"><div class="empty">Loading setup engine…</div></div>`;anchor.insertAdjacentElement('afterend',sec);
  const modal=document.createElement('div');modal.id='setupModal';modal.className='setupModal';modal.innerHTML='<div class="setupModalCard"><div class="setupModalHead"><div><b id="setupModalTitle">Workflow setup</b><div id="setupModalSub" class="small muted"></div></div><button class="setupClose" onclick="window.closeSetupModal()">Close</button></div><div id="setupModalBody" class="setupModalBody"></div></div>';document.body.appendChild(modal);
}
async function setupLoad(){
  setupInstall();
  try{
    const [sr,ur,cr]=await Promise.all([fetch('/api/admin/setup-engine',{cache:'no-store'}),fetch('/api/admin/users',{cache:'no-store'}),fetch('/api/admin/onboarding-candidates',{cache:'no-store'})]);
    if(sr.status===401)return;if(!sr.ok||!ur.ok||!cr.ok)throw 0;
    const s=await sr.json(),u=await ur.json(),c=await cr.json();
    setupState={...s,users:u.users||[],candidateResponses:c.responses||[],invitations:c.invitations||[],email_delivery_configured:Boolean(c.email_delivery_configured)};
    setupRender();
  }catch{const e=document.getElementById('setupRows');if(e)e.innerHTML='<div class="empty">Could not load the Concierge Setup Engine.</div>'}
}
function workerOptions(selected=''){return `<option value="">Create from assessment</option>${(setupState.users||[]).filter(u=>u.status!=='disabled').map(u=>`<option value="${u.id}" ${u.id===selected?'selected':''}>${setupEsc(u.full_name)} · @${setupEsc(u.username)}${u.job_title?' · '+setupEsc(u.job_title):''}</option>`).join('')}`}
function setupRender(){
  setupInstall();const badge=document.getElementById('setupJevBadge');if(badge){badge.textContent=setupState.jev_configured?'JEV · CONNECTED':'JEV · NOT CONNECTED';badge.className='pill '+(setupState.jev_configured?'good':'warn')}
  const rows=document.getElementById('setupRows');if(!rows)return;const responses=(setupState.responses||[]).filter(r=>!/^test\b/i.test(String(r.name||'').trim()));
  rows.innerHTML=responses.length?responses.map(r=>{
    const map=setupLatest(setupState.maps,r.id),profile=setupLatest(setupState.profiles,r.id),decision=profile?.jev_decision_id?(setupState.decisions||[]).find(d=>d.id===profile.jev_decision_id):setupLatest(setupState.decisions,r.id),worker=setupWorker(profile,map),candidate=candidateFor(r.id),invite=inviteFor(r.id);
    const route=decision?.route||null,mods=profile?.setup_config?.modules||[],questions=profile?.setup_config?.clarification_questions||decision?.clarification_questions||[],active=Boolean(profile?.applied_at),contact=candidate?.contact_email||worker?.contact_email||'',legacy=!contact;
    const inviteLabel=invite?`Invitation ${String(invite.status||'').replaceAll('_',' ')}`:'';
    return `<div class="setupRow"><div class="setupRowHead"><div><div class="setupTitle">${setupEsc(r.name)}</div><div class="small muted">${setupEsc(r.job_title||'Role not provided')}${r.organisation?' · '+setupEsc(r.organisation):''}</div><div class="setupStatus"><span class="pill ${map?'good':''}">${map?'Workflow map ready':'Assessment submitted'}</span>${route?`<span class="pill ${route==='green'?'good':route==='red'?'bad':'warn'}">Jev ${setupEsc(route.toUpperCase())}</span>`:''}${profile?`<span class="pill ${active?'good':profile.status==='needs_clarification'?'warn':''}">${active?'SETUP APPLIED':setupEsc(profile.status.replaceAll('_',' '))}</span>`:''}${worker?`<span class="pill good">${worker.status==='invited'?'Account invited':'Worker · '+setupEsc(worker.full_name)}</span>`:''}${invite?`<span class="pill ${invite.status==='activated'?'good':'warn'}">${setupEsc(inviteLabel)}</span>`:''}</div></div><div class="actions" style="margin-top:0"><button class="btn small" onclick="window.generateSetup('${r.id}',this)">${profile?'Regenerate':'Generate workflow map'}</button>${profile?`<button class="btn secondary small" onclick="window.viewSetup('${r.id}')">Review setup</button>`:''}${profile&&!active?`<button class="btn secondary small" onclick="window.approveSetup('${profile.id}','${r.id}',this)">Approve & invite</button>`:''}</div></div>
    ${profile&&!active?`<div class="setupLink"><div><div class="small muted">Personal/contact email</div><input id="setupEmail-${profile.id}" type="email" placeholder="name@example.com" value="${setupEsc(contact)}"></div><div><div class="small muted">Existing account (optional)</div><select id="setupWorker-${profile.id}">${workerOptions(worker?.id||'')}</select></div>${legacy?`<span class="setupLegacy">Legacy submission: contact email was not collected. Add it once here.</span>`:`<span class="small muted">Used only for invitation, login recovery and account notices. It is not a work source.</span>`}</div>`:''}
    ${invite?`<div class="setupInvite ${invite.status==='activated'?'good':'warn'}">${setupEsc(invite.contact_email)} · ${setupEsc(invite.status)}${invite.sent_at?' · sent '+new Date(invite.sent_at).toLocaleString():''}</div>`:''}
    ${profile?`<div class="setupDetailGrid"><div class="setupBox"><h5>Jev evaluation</h5><div class="setupRoute ${setupEsc(route||'unavailable')}">${setupEsc((route||'unavailable').toUpperCase())}${decision?.confidence!=null?' · '+Math.round(Number(decision.confidence)*100)+'% confidence':''}</div>${(decision?.gate_reasons||[]).length?`<div class="small muted" style="margin-top:5px">${setupEsc(decision.gate_reasons.join(' · ').replaceAll('_',' '))}</div>`:''}${questions.length?`<ul class="setupQuestions">${questions.map(q=>`<li>${setupEsc(q)}</li>`).join('')}</ul>`:''}</div><div class="setupBox"><h5>Proposed modules</h5><div class="setupModules">${mods.map(m=>`<span class="setupModule ${m.enabled?'':'off'}">${setupEsc(m.label)}</span>`).join('')}</div></div></div>`:''}</div>`;
  }).join(''):'<div class="empty">No real assessment submissions are available yet. Test submissions are excluded from setup generation.</div>';
}
window.generateSetup=async(id,btn)=>{btn.disabled=true;btn.textContent='Generating…';try{const r=await fetch(`/api/admin/setup-engine/${id}/generate`,{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Generation failed');if(window.toast)toast('Workflow Map, Jev evaluation and setup generated');await setupLoad();window.viewSetup(id)}catch(e){if(window.toast)toast(e.message||'Generation failed');else alert(e.message)}finally{btn.disabled=false}};
window.approveSetup=async(id,responseId,btn)=>{
  const sel=document.getElementById(`setupWorker-${id}`),worker_user_id=sel?.value||'',email=String(document.getElementById(`setupEmail-${id}`)?.value||'').trim();
  if(!email&&!worker_user_id){if(window.toast)toast('Add the respondent’s personal/contact email before approval');return}
  if(!confirm('Approve this Concierge setup and prepare the worker account? The worker will create their own password and authorize their own work sources.'))return;
  btn.disabled=true;btn.textContent='Approving…';
  try{
    const r=await fetch(`/api/admin/setup-engine/${id}/approve`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({worker_user_id:worker_user_id||undefined,contact_email:email||undefined})}),d=await r.json();
    if(!r.ok)throw new Error(d.error||'Approval failed');
    if(d.invitation?.delivery?.sent){if(window.toast)toast(`Approved. Activation email sent to ${d.worker?.contact_email||email}`)}
    else if(d.invitation?.activation_url){prompt('Setup approved. Transactional email is not configured yet. Copy this secure activation link for testing:',d.invitation.activation_url)}
    else if(window.toast)toast(`Concierge setup applied for ${d.worker?.full_name||'worker'}`);
    await setupLoad();
  }catch(e){if(window.toast)toast(e.message||'Approval failed')}finally{btn.disabled=false;btn.textContent='Approve & invite'}
};
window.viewSetup=id=>{
  const r=(setupState.responses||[]).find(x=>x.id===id),map=setupLatest(setupState.maps,id),profile=setupLatest(setupState.profiles,id),decision=profile?.jev_decision_id?(setupState.decisions||[]).find(d=>d.id===profile.jev_decision_id):setupLatest(setupState.decisions,id),worker=setupWorker(profile,map),candidate=candidateFor(id),invite=inviteFor(id);
  if(!r||!map||!profile)return;
  document.getElementById('setupModalTitle').textContent=`${r.name} · Concierge Setup`;
  document.getElementById('setupModalSub').textContent=`${r.job_title||''}${r.organisation?' · '+r.organisation:''}${worker?' · '+worker.username:''}`;
  const wm=map.workflow_map||{},cfg=profile.setup_config||{},mods=cfg.modules||[];
  document.getElementById('setupModalBody').innerHTML=`<div class="setupDetailGrid"><div class="setupBox"><h5>Workflow Map</h5><div class="setupFacts"><div class="setupFact"><b>Role & responsibilities</b>${setupEsc(wm.role_context?.responsibilities||'—')}</div><div class="setupFact"><b>Recurring work</b>${setupEsc(wm.recurring_work?.repetitive_tasks||'—')}</div><div class="setupFact"><b>Email work</b>${setupEsc(wm.work_sources?.email_work||'—')}</div><div class="setupFact"><b>Reports & outputs</b>${setupEsc(wm.outputs?.reports||'—')}</div><div class="setupFact"><b>Deadlines</b>${setupEsc(wm.deadlines?.tracking_problem||'—')}</div><div class="setupFact"><b>Desired automation</b>${setupEsc(wm.desired_automation?.assistant_tasks||wm.desired_automation?.eliminate_task||'—')}</div></div></div><div class="setupBox"><h5>Jev → Concierge Setup</h5><div class="setupRoute ${setupEsc(decision?.route||'unavailable')}">${setupEsc((decision?.route||'unavailable').toUpperCase())}${decision?.confidence!=null?' · '+Math.round(Number(decision.confidence)*100)+'% confidence':''}</div><div class="small muted" style="margin:5px 0 12px">Work pattern: ${setupEsc(cfg.work_pattern||'—')}</div><div class="setupModules">${mods.map(m=>`<span class="setupModule ${m.enabled?'':'off'}">${setupEsc(m.label)}</span>`).join('')}</div><h5 style="margin-top:16px">Account onboarding</h5><div class="small">Contact email: <b>${setupEsc(candidate?.contact_email||worker?.contact_email||'Not collected')}</b><br>Account: <b>${setupEsc(worker?worker.username:'Created after approval')}</b><br>Invitation: <b>${setupEsc(invite?.status||'Not sent')}</b><br>Work-source authorization: <b>Worker only</b></div><h5 style="margin-top:16px">Human controls</h5><div class="small">External send approval: <b>Required</b><br>Financial/beneficiary decisions: <b>Authorised human required</b><br>Project evidence isolation: <b>${cfg.evidence_policy?.project_isolation?'On':'Not required by assessment'}</b></div>${(cfg.clarification_questions||[]).length?`<h5 style="margin-top:16px">Clarification needed</h5><ul class="setupQuestions">${cfg.clarification_questions.map(q=>`<li>${setupEsc(q)}</li>`).join('')}</ul>`:''}</div></div>`;
  document.getElementById('setupModal').classList.add('open')
};
window.closeSetupModal=()=>document.getElementById('setupModal')?.classList.remove('open');
setupInstall();setupLoad();document.getElementById('refresh')?.addEventListener('click',()=>setTimeout(setupLoad,100));
})();
</script>
