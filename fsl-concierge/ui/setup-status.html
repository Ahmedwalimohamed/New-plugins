<style>
.setup-runtime{margin-bottom:18px}.setup-runtime .setup-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.setup-runtime .setup-steps{display:grid;gap:8px;margin-top:12px}.setup-runtime .setup-step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfd}.setup-runtime .setup-step.done{background:#f4fbf7;border-color:#c8e3d2}.setup-runtime .setup-alert{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff8e9;border:1px solid #eadbb5;color:#755a18}
</style>
<script>
async function loadAppliedSetup(){
  try{
    const r=await api('/api/setup',{cache:'no-store'});if(!r.ok)return;const d=await r.json();
    const home=$('page-home');if(!home)return;let box=$('appliedSetupCard');if(!box){box=document.createElement('section');box.id='appliedSetupCard';box.className='card pad setup-runtime';const hero=home.querySelector('.hero');if(hero)hero.insertAdjacentElement('afterend',box);else home.prepend(box)}
    if(!d.applied){box.innerHTML=`<div class="setup-head"><div><div class="eyebrow muted">Concierge setup</div><h3 style="margin:3px 0">Setup awaiting application</h3><div class="small muted">Your administrator has not yet applied a personalised Concierge setup.</div></div><span class="tag warn">SETUP PENDING</span></div>`;return}
    const steps=d.onboarding?.steps||[],done=steps.filter(x=>x.done).length,total=steps.length;
    box.innerHTML=`<div class="setup-head"><div><div class="eyebrow muted">Personalised Concierge</div><h3 style="margin:3px 0">${esc(d.setup_config?.identity?.job_title||'Worker')} setup active</h3><div class="small muted">${total?`${done}/${total} onboarding checks complete`:'Your approved setup is active.'}</div></div><span class="tag ${d.onboarding?.complete?'good':'warn'}">${d.onboarding?.complete?'ACTIVE':'ACTION NEEDED'}</span></div>${steps.length?`<div class="setup-steps">${steps.map(s=>`<div class="setup-step ${s.done?'done':''}"><span>${s.done?'✓':'○'} ${esc(s.label)}</span><span class="small muted">${s.done?'Done':'Required'}</span></div>`).join('')}</div>`:''}${d.health?.email_sync_stale?`<div class="setup-alert"><b>Email evidence needs refresh.</b> The connected mailbox has not synced recently, so new work may be missing from the Work Queue.</div>`:''}`;
    const enabled=new Set((d.setup_config?.modules||[]).filter(x=>x.enabled).map(x=>x.id));
    document.querySelectorAll('.navbtn[data-page="projects"]').forEach(x=>x.classList.toggle('hidden',d.applied&&enabled.size&&!enabled.has('projects')));
    document.querySelectorAll('.navbtn[data-page="tasks"]').forEach(x=>x.classList.toggle('hidden',d.applied&&enabled.size&&!enabled.has('tasks')));
    document.querySelectorAll('.navbtn[data-page="documents"]').forEach(x=>x.classList.toggle('hidden',d.applied&&enabled.size&&!enabled.has('documents')));
  }catch(e){console.error('applied setup',e)}
}
const __setupStatusLoad=load;load=async function(){await __setupStatusLoad();await loadAppliedSetup()};
loadAppliedSetup();
</script>
