<style>
.setup-runtime{margin-bottom:18px}.setup-runtime .setup-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.setup-runtime .setup-steps{display:grid;gap:8px;margin-top:12px}.setup-runtime .setup-step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfd}.setup-runtime .setup-step.done{background:#f4fbf7;border-color:#c8e3d2}.setup-runtime .setup-alert{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff8e9;border:1px solid #eadbb5;color:#755a18}.setup-capabilities{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.setup-capability{font-size:10px;font-weight:850;padding:4px 7px;border-radius:999px;background:#edf5f8;color:#315565}
</style>
<script>
function applyConciergeModules(d){
  const enabled=new Set(d.enabled_modules||[]),active=Boolean(d.applied),has=id=>!active||enabled.has(id);
  document.querySelectorAll('.navbtn[data-page="projects"],.mobilebar [data-page="projects"]').forEach(x=>x.classList.toggle('hidden',active&&!has('projects')));
  document.querySelectorAll('.navbtn[data-page="tasks"],.mobilebar [data-page="tasks"]').forEach(x=>x.classList.toggle('hidden',active&&!has('tasks')));
  document.querySelectorAll('.navbtn[data-page="documents"],.mobilebar [data-page="documents"]').forEach(x=>x.classList.toggle('hidden',active&&!has('documents')));
  const profileLine=$('profileLine');if(profileLine)profileLine.textContent=has('projects')?'Here is what needs your attention and what changed across your projects.':'Here is what needs your attention and what changed across your operational evidence.';
  const intelTitle=$('intelligence')?.closest('.card')?.querySelector('h3');if(intelTitle)intelTitle.textContent=has('projects')?'Latest project intelligence':'Latest operational intelligence';
  const intelCopy=$('intelligence')?.closest('.card')?.querySelector('.sectionhead p');if(intelCopy)intelCopy.textContent=has('projects')?'Important evidence and changes that may affect your projects.':'Important evidence and changes that may affect your work.';
  const run=$('run');if(run){run.disabled=!active;run.title=active?'':'Your administrator must approve and apply your Concierge setup first.'}
}
async function loadAppliedSetup(){
  try{
    const r=await api('/api/setup',{cache:'no-store'});if(!r.ok)return;const d=await r.json();applyConciergeModules(d);
    const home=$('page-home');if(!home)return;let box=$('appliedSetupCard');if(!box){box=document.createElement('section');box.id='appliedSetupCard';box.className='card pad setup-runtime';const hero=home.querySelector('.hero');if(hero)hero.insertAdjacentElement('afterend',box);else home.prepend(box)}
    if(!d.applied){box.innerHTML=`<div class="setup-head"><div><div class="eyebrow muted">Concierge setup</div><h3 style="margin:3px 0">Setup awaiting approval</h3><div class="small muted">Your workspace is private, but AI work stays paused until an administrator applies the Concierge configuration generated from your assessment.</div></div><span class="tag warn">SETUP PENDING</span></div>`;return}
    const steps=d.onboarding?.steps||[],done=steps.filter(x=>x.done).length,total=steps.length,mods=(d.setup_config?.modules||[]).filter(x=>x.enabled);
    box.innerHTML=`<div class="setup-head"><div><div class="eyebrow muted">Your Concierge configuration</div><h3 style="margin:3px 0">${esc(d.setup_config?.identity?.job_title||'Humanitarian worker')} setup active</h3><div class="small muted">${total?`${done}/${total} onboarding checks complete`:'Your approved setup is active.'}</div></div><span class="tag ${d.onboarding?.complete?'good':'warn'}">${d.onboarding?.complete?'ACTIVE':'ACTION NEEDED'}</span></div>${mods.length?`<div class="setup-capabilities">${mods.map(m=>`<span class="setup-capability">${esc(m.label)}</span>`).join('')}</div>`:''}${steps.length?`<div class="setup-steps">${steps.map(s=>`<div class="setup-step ${s.done?'done':''}"><span>${s.done?'✓':'○'} ${esc(s.label)}</span><span class="small muted">${s.done?'Done':'Required'}</span></div>`).join('')}</div>`:''}${d.health?.email_sync_stale?`<div class="setup-alert"><b>Email evidence needs refresh.</b> The connected mailbox has not synced recently, so new work may be missing from the Work Queue.</div>`:''}`;
  }catch(e){console.error('applied setup',e)}
}
const __setupStatusLoad=load;load=async function(){await __setupStatusLoad();await loadAppliedSetup()};
loadAppliedSetup();
</script>
