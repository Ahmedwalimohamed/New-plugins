<style>
/* Project Intelligence */
.project-portfolio-strip{margin:18px 0}.project-portfolio-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.project-portfolio-head h3{margin:0;font-size:14px}.project-portfolio-head p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.project-mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.project-mini{border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;cursor:pointer;text-align:left}.project-mini:hover{border-color:var(--line-strong);background:#fbfdfe}.project-mini b{display:block;font-size:12px}.project-mini span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.project-mini .project-mini-count{font-size:18px;color:var(--navy);font-weight:900;margin-top:8px}
.project-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.project-toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:15px}.project-card:hover{border-color:var(--line-strong)}.project-card h3{margin:2px 0 4px;font-size:16px}.project-code{font-size:10px;font-weight:900;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}.project-desc{font-size:11px;color:var(--muted);min-height:34px;margin-top:5px}.project-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.project-metric{border:1px solid #edf1f3;border-radius:8px;padding:7px;background:#fbfcfd}.project-metric b{display:block;font-size:15px}.project-metric span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;font-weight:900;letter-spacing:.04em}.project-next{font-size:10px;color:var(--muted);margin:7px 0}.project-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.project-alert{border:1px solid #eadbb5;background:#fff9ec;border-radius:12px;padding:13px;margin:0 0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.project-alert strong{display:block}.project-alert small{color:#765b1b}.project-insight{border-left:3px solid var(--warn);padding:8px 10px;background:#fffaf0;margin-top:8px;font-size:11px}.project-empty{padding:30px;text-align:center;border:1px dashed var(--line-strong);border-radius:13px;background:#fbfdfe}.project-empty h3{margin:0 0 5px}
.project-form{display:grid;grid-template-columns:1.2fr .55fr 1fr 1fr;gap:9px}.project-form .wide{grid-column:span 2}.project-form .full{grid-column:1/-1}.project-form label{display:block;font-size:10px;font-weight:900;color:var(--muted);margin-bottom:4px}.project-form input,.project-form textarea,.project-form select{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:9px 10px;font:inherit;background:#fff}.project-form textarea{min-height:68px;resize:vertical}
.project-detail-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.project-detail-head h2{margin:3px 0 4px}.project-detail-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.project-detail-grid{display:grid;grid-template-columns:1.45fr .85fr;gap:14px;margin-top:14px}.project-section{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px}.project-section h3{font-size:13px;margin:0 0 9px}.project-row{padding:10px 0;border-top:1px solid #edf1f3}.project-row:first-child{border-top:0;padding-top:0}.project-row:last-child{padding-bottom:0}.project-row strong{display:block;font-size:12px}.project-row small{color:var(--muted)}.project-memory-row{padding:9px;border:1px solid #edf1f3;border-radius:9px;margin-top:7px}.project-memory-row b{font-size:11px}.project-memory-row div{font-size:11px;margin-top:2px;color:#425963}.project-unassigned-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.project-unassigned-col{border:1px solid var(--line);border-radius:11px;padding:11px}.project-unassigned-col h4{margin:0 0 8px}.project-assign-row{padding:8px 0;border-top:1px solid #edf1f3}.project-assign-row:first-of-type{border-top:0}.project-assign-row b{display:block;font-size:10px}.project-assign-row select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:7px;padding:6px;background:#fff;font-size:10px}
@media(max-width:900px){.project-grid,.project-detail-grid{grid-template-columns:1fr}.project-form{grid-template-columns:1fr 1fr}.project-unassigned-grid{grid-template-columns:1fr}.project-mini-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.project-grid,.project-form,.project-mini-grid{grid-template-columns:1fr}.project-form .wide,.project-form .full{grid-column:auto}.project-metrics{grid-template-columns:1fr 1fr}.project-toolbar,.project-alert,.project-detail-head{align-items:flex-start;flex-direction:column}}
</style>
<script>
let projectState={projects:[],unassigned:{},insights:{},selected:null,detail:null,unassignedDetail:null};
const projectName=id=>projectState.projects.find(p=>p.id===id)?.name||'Unassigned';
function projectInstall(){
  const page=$('page-projects');if(!page||$('projectIntelligenceRoot'))return;
  page.innerHTML=`<div id="projectIntelligenceRoot"><div class="hero"><div><div class="eyebrow muted">Portfolio command center</div><h1>Project Intelligence</h1><p>Keep each project's evidence, work, deadlines and memory separate while seeing your whole portfolio in one place.</p></div><button class="btn" type="button" onclick="projectShowCreate()">+ Create project</button></div><div id="projectCreateBox" class="card pad hidden" style="margin-bottom:15px"></div><div id="projectPortfolio"></div><div id="projectDetail"></div></div>`;
  const home=document.querySelector('#page-home .summarygrid');if(home&&!$('projectPortfolioStrip')){const s=document.createElement('section');s.id='projectPortfolioStrip';s.className='card pad project-portfolio-strip';home.parentElement.insertBefore(s,home)}
}
async function projectLoad(){projectInstall();try{const r=await api('/api/projects',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Project load failed');projectState.projects=d.projects||[];projectState.unassigned=d.unassigned||{};projectState.insights=d.insights||{};projectRenderPortfolio();projectRenderHomeStrip();if(projectState.selected)await projectOpen(projectState.selected,true)}catch(e){if(e.message!=='auth')console.error('Project Intelligence',e)}}
function projectRenderHomeStrip(){const root=$('projectPortfolioStrip');if(!root)return;const ps=projectState.projects.filter(p=>p.status==='active'),actions=ps.reduce((n,p)=>n+Number(p.metrics?.actions||0),0),deadlines=ps.reduce((n,p)=>n+Number(p.metrics?.deadlines||0),0);root.innerHTML=`<div class="project-portfolio-head"><div><h3>Project portfolio</h3><p>Cross-project view. Open Project Intelligence for the evidence behind each number.</p></div><button class="btn secondary smallbtn" onclick="setPage('projects')">View projects</button></div>${ps.length?`<div class="project-mini-grid">${ps.slice(0,3).map(p=>`<button class="project-mini" onclick="setPage('projects');projectOpen('${p.id}')"><b>${esc(p.name)}</b><span>${esc(p.code||p.donor||'Active project')}</span><div class="project-mini-count">${Number(p.metrics?.actions||0)}</div><span>actions · ${Number(p.metrics?.deadlines||0)} deadlines</span></button>`).join('')}</div><div class="small muted" style="margin-top:9px">${ps.length} active project${ps.length===1?'':'s'} · ${actions} action${actions===1?'':'s'} · ${deadlines} upcoming deadline${deadlines===1?'':'s'}</div>`:'<div class="empty">No projects yet. Create your first project to separate evidence and Operations Memory.</div>'}`}
function projectRenderPortfolio(){const root=$('projectPortfolio');if(!root)return;const ps=projectState.projects,totalUnassigned=Object.values(projectState.unassigned||{}).reduce((a,b)=>a+Number(b||0),0),conflicts=projectState.insights?.cross_project_deadline_conflicts||[],overdue=Number(projectState.insights?.overdue_assignments||0);root.innerHTML=`${totalUnassigned?`<div class="project-alert"><div><strong>${totalUnassigned} evidence item${totalUnassigned===1?'':'s'} not assigned to a project</strong><small>Keep them unassigned until verified, auto-route obvious matches, or assign them manually.</small></div><button class="btn secondary smallbtn" onclick="projectShowUnassigned()">Review evidence</button></div>`:''}${conflicts.length||overdue?`<section class="card pad" style="margin-bottom:15px"><div class="sectionhead"><div><h3>Cross-project attention</h3><p>Conflicts that are easy to miss when projects are managed separately.</p></div><span class="tag warn">${conflicts.length+overdue} signal${conflicts.length+overdue===1?'':'s'}</span></div>${conflicts.length?`<div class="project-insight"><b>Deadline collision:</b> ${conflicts.length} upcoming deadline${conflicts.length===1?'':'s'} sit within two days of work in another project.</div>`:''}${overdue?`<div class="project-insight"><b>Delegated work:</b> ${overdue} assignment${overdue===1?' is':'s are'} overdue across your portfolio.</div>`:''}</section>`:''}<div class="project-toolbar"><div><b>${ps.length} project${ps.length===1?'':'s'}</b><div class="small muted">Evidence is isolated by project for AI work.</div></div><div class="project-toolbar-actions"><button class="btn secondary smallbtn" onclick="projectShowUnassigned()">Unassigned evidence</button><button class="btn smallbtn" onclick="projectShowCreate()">+ Create project</button></div></div>${ps.length?`<div class="project-grid">${ps.map(projectCard).join('')}</div>`:`<div class="project-empty"><h3>Create your first project</h3><div class="muted">Add a project name and code. The Concierge will then keep its emails, documents, memory and work products together.</div><div class="actions" style="justify-content:center"><button class="btn" onclick="projectShowCreate()">Create project</button></div></div>`}`}
function projectCard(p){const m=p.metrics||{};return `<article class="project-card"><div class="rowtop"><div><div class="project-code">${esc(p.code||'Project')}</div><h3>${esc(p.name)}</h3></div><span class="tag ${p.status==='active'?'good':p.status==='paused'?'warn':''}">${esc(String(p.status).toUpperCase())}</span></div><div class="project-desc">${esc(p.description||[p.donor,p.location].filter(Boolean).join(' · ')||'No project description added yet.')}</div><div class="project-metrics"><div class="project-metric"><b>${Number(m.actions||0)}</b><span>Actions</span></div><div class="project-metric"><b>${Number(m.deadlines||0)}</b><span>Deadlines</span></div><div class="project-metric"><b>${Number(m.documents||0)}</b><span>Documents</span></div><div class="project-metric"><b>${Number(m.delegated||0)}</b><span>Delegated</span></div></div><div class="project-next">${p.next_deadline?`Next deadline: ${esc(when(p.next_deadline))}`:'No upcoming deadline recorded.'}</div><div class="project-actions"><button class="btn smallbtn" onclick="projectOpen('${p.id}')">Open project</button><button class="btn secondary smallbtn" onclick="projectRoute('${p.id}')">Route evidence</button></div></article>`}
function projectShowCreate(){projectInstall();const box=$('projectCreateBox');box.classList.remove('hidden');box.innerHTML=`<div class="sectionhead"><div><h3>Create project</h3><p>Use the official project name/code. Add common abbreviations so incoming evidence can be routed correctly.</p></div><button class="btn secondary smallbtn" onclick="$ ('projectCreateBox').classList.add('hidden')">Close</button></div><form id="projectCreateForm" class="project-form"><div><label>Project name *</label><input id="piName" required placeholder="SUIDAC Project"></div><div><label>Project code</label><input id="piCode" placeholder="SUIDAC"></div><div><label>Donor / partner</label><input id="piDonor" placeholder="Optional"></div><div><label>Location</label><input id="piLocation" placeholder="Optional"></div><div class="wide"><label>Aliases / abbreviations</label><input id="piAliases" placeholder="SUIDAC, urban livelihoods, project nickname"></div><div><label>Start date</label><input id="piStart" type="date"></div><div><label>End date</label><input id="piEnd" type="date"></div><div class="full"><label>Description</label><textarea id="piDescription" placeholder="Purpose, main workstreams, target area or other context that helps identify the project."></textarea></div><div class="full"><button class="btn" type="submit">Create project</button></div></form>`;$('projectCreateForm').onsubmit=projectCreate}
async function projectCreate(e){e.preventDefault();const payload={name:$('piName').value.trim(),code:$('piCode').value.trim(),donor:$('piDonor').value.trim(),location:$('piLocation').value.trim(),aliases:$('piAliases').value.split(',').map(x=>x.trim()).filter(Boolean),start_date:$('piStart').value||null,end_date:$('piEnd').value||null,description:$('piDescription').value.trim()};const r=await api('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok){toast(d.error||'Could not create project');return}toast('Project created');$('projectCreateBox').classList.add('hidden');await projectLoad();if(d.project?.id)await projectRoute(d.project.id)}
async function projectRoute(id){const r=await api(`/api/projects/${id}/route-unassigned`,{method:'POST'}),d=await r.json().catch(()=>({}));if(!r.ok){toast(d.error||'Could not route evidence');return}toast(d.routed?`${d.routed} evidence item${d.routed===1?'':'s'} routed`:'No verified automatic matches found');await projectLoad();if(d.needs_review?.length)projectShowRoutingReview(id,d.needs_review)}
function projectShowRoutingReview(projectId,rows){const root=$('projectDetail');root.innerHTML=`<section class="card pad"><div class="sectionhead"><div><h3>Possible project matches</h3><p>These were not auto-routed because confidence was below the automatic threshold. You decide.</p></div><button class="btn secondary smallbtn" onclick="projectOpen('${projectId}')">Back to project</button></div>${rows.map(x=>`<div class="project-row"><strong>${esc(x.label||x.entity_type)}</strong><small>${Math.round(Number(x.confidence||0)*100)}% · ${esc(x.reason||'Possible match')}</small><div class="actions"><button class="btn smallbtn" onclick="projectAssign('${projectId}','${x.entity_type}','${x.entity_id}')">Assign to project</button></div></div>`).join('')}</section>`;root.scrollIntoView({behavior:'smooth',block:'start'})}
async function projectOpen(id,quiet=false){projectState.selected=id;const root=$('projectDetail');if(!quiet){root.innerHTML='<div class="card pad"><div class="empty">Loading project workspace…</div></div>';root.scrollIntoView({behavior:'smooth',block:'start'})}const r=await api(`/api/projects/${id}`,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok){toast(d.error||'Could not open project');return}projectState.detail=d;projectRenderDetail(d)}
function projectRenderDetail(d){const root=$('projectDetail'),p=d.project,items=d.items||[],actions=items.filter(i=>i.status==='active'&&(i.needs_user??i.needs_hibo)),deadlines=items.filter(i=>i.status!=='completed'&&i.due_at&&new Date(i.due_at)>=new Date()).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at)),assignments=(d.assignments||[]).filter(a=>!['completed','cancelled'].includes(a.status));root.innerHTML=`<section class="card pad" style="margin-top:16px"><div class="project-detail-head"><div><div class="project-code">${esc(p.code||'Project workspace')}</div><h2>${esc(p.name)}</h2><div class="muted">${esc(p.description||'Project-specific evidence and operations memory.')}</div><div class="project-detail-meta"><span class="tag ${p.status==='active'?'good':''}">${esc(String(p.status).toUpperCase())}</span>${p.donor?`<span class="tag">${esc(p.donor)}</span>`:''}${p.location?`<span class="tag">${esc(p.location)}</span>`:''}</div></div><div class="project-actions"><button class="btn secondary smallbtn" onclick="projectRoute('${p.id}')">Route new evidence</button><button class="btn secondary smallbtn" onclick="projectState.selected=null;$('projectDetail').innerHTML=''">Close</button></div></div><div class="project-metrics" style="margin-top:16px"><div class="project-metric"><b>${actions.length}</b><span>Actions</span></div><div class="project-metric"><b>${deadlines.length}</b><span>Deadlines</span></div><div class="project-metric"><b>${(d.documents||[]).length}</b><span>Documents</span></div><div class="project-metric"><b>${assignments.length}</b><span>Delegated</span></div></div><div class="project-detail-grid"><div class="stack"><div class="project-section"><h3>Work queue</h3>${actions.length?actions.slice(0,10).map(i=>`<div class="project-row"><strong>${esc(i.title)}</strong><small>${esc(i.summary||i.email_snippet||'Action required')}${i.due_at?' · due '+esc(when(i.due_at)):''}</small><div class="actions">${typeof jevOpenTask==='function'?`<button class="btn smallbtn" onclick="jevOpenTask('${i.id}')">${esc(i.action_label||'Do the work')}</button>`:''}</div></div>`).join(''):'<div class="empty">No open action for this project.</div>'}</div><div class="project-section"><h3>Operations Memory</h3>${(d.memory||[]).length?(d.memory||[]).map(m=>`<div class="project-memory-row"><b>${esc(m.workstream)}</b><div>${esc(m.current_state)}</div><small class="muted">${esc(m.owner||'No owner')}${m.next_date?' · '+esc(m.next_date):''}</small></div>`).join(''):'<div class="empty">No project-specific memory yet.</div>'}</div><div class="project-section"><h3>Documents</h3>${(d.documents||[]).length?(d.documents||[]).slice(0,12).map(x=>`<div class="project-row"><strong>${esc(x.file_name)}</strong><small>${esc(x.category||'Project document')} · ${esc(size(x.size_bytes))}</small><div class="actions"><a class="btn secondary smallbtn link" href="/api/documents/${x.id}/download" target="_blank">Open</a></div></div>`).join(''):'<div class="empty">No document assigned to this project.</div>'}</div></div><div class="stack"><div class="project-section"><h3>Upcoming deadlines</h3>${deadlines.length?deadlines.slice(0,10).map(i=>`<div class="project-row"><strong>${esc(i.title)}</strong><small>${esc(when(i.due_at))} · ${esc(i.owner||'Unassigned')}</small></div>`).join(''):'<div class="empty">No upcoming project deadline.</div>'}</div><div class="project-section"><h3>Delegated work</h3>${assignments.length?assignments.slice(0,10).map(a=>`<div class="project-row"><strong>${esc(a.title)}</strong><small>${esc(String(a.status).replaceAll('_',' '))}${a.due_at?' · due '+esc(when(a.due_at)):''}</small></div>`).join(''):'<div class="empty">No open delegated work.</div>'}</div><div class="project-section"><h3>Evidence routing</h3><div class="small muted">${(d.routing||[]).length} recent routing decision${(d.routing||[]).length===1?'':'s'} recorded. New evidence stays unassigned when the project match is uncertain.</div><div class="actions"><button class="btn secondary smallbtn" onclick="projectShowUnassigned()">Review unassigned</button></div></div></div></div></section>`}
async function projectShowUnassigned(){const r=await api('/api/project-unassigned',{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok){toast(d.error||'Could not load unassigned evidence');return}projectState.unassignedDetail=d;const root=$('projectDetail'),select=(type,id)=>`<select onchange="if(this.value){projectAssign(this.value,'${type}','${id}');this.value=''}"><option value="">Assign to project…</option>${projectState.projects.filter(p=>p.status==='active').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`,col=(title,rows,type,label,sub)=>`<div class="project-unassigned-col"><h4>${title} · ${rows.length}</h4>${rows.length?rows.slice(0,25).map(x=>`<div class="project-assign-row"><b>${esc(label(x))}</b><small class="muted">${esc(sub(x))}</small>${select(type,x.id)}</div>`).join(''):'<div class="empty">None</div>'}</div>`;root.innerHTML=`<section class="card pad" style="margin-top:16px"><div class="sectionhead"><div><h3>Unassigned evidence</h3><p>Evidence is not used across projects automatically. Assign only when you know where it belongs.</p></div><button class="btn secondary smallbtn" onclick="projectState.selected?projectOpen(projectState.selected):$('projectDetail').innerHTML=''">Close</button></div><div class="project-unassigned-grid">${col('Work items',d.items||[],'item',x=>x.title||'Work item',x=>x.summary||x.email_snippet||'')}${col('Documents',d.documents||[],'document',x=>x.file_name||'Document',x=>x.category||x.description||'')}${col('Memory',d.memory||[],'memory',x=>x.workstream||'Memory',x=>x.current_state||'')}</div></section>`;root.scrollIntoView({behavior:'smooth',block:'start'})}
async function projectAssign(projectId,type,id){const r=await api(`/api/projects/${projectId}/assign`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({entity_type:type,entity_id:id})}),d=await r.json().catch(()=>({}));if(!r.ok){toast(d.error||'Could not assign evidence');return}toast(`Evidence assigned to ${projectName(projectId)}`);await projectLoad();await projectShowUnassigned()}
const __projectBaseLoad=load;load=async function(){await __projectBaseLoad();await projectLoad()};
projectInstall();projectLoad();
</script>
