<style>
.sourceHealthCard{margin-bottom:17px}.sourceHealthGrid{display:grid;gap:10px}.sourceHealthRow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line,#dbe5e9)}.sourceHealthRow:last-child{border-bottom:0}.sourceHealthMain{display:flex;gap:11px;align-items:flex-start}.sourceDot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:#9aa9b0;box-shadow:0 0 0 4px #9aa9b018}.sourceDot.live{background:#28704a;box-shadow:0 0 0 4px #28704a18}.sourceDot.waiting,.sourceDot.delayed{background:#b77816;box-shadow:0 0 0 4px #b7781618}.sourceDot.error,.sourceDot.stale{background:#a83a30;box-shadow:0 0 0 4px #a83a3018}.sourceHealthActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.sourceTruthRule{margin-top:12px;padding:11px 12px;border-radius:10px;background:#f4f8fa;font-size:12px;color:var(--muted,#687984)}
@media(max-width:700px){.sourceHealthRow{grid-template-columns:1fr}.sourceHealthRow>.tag{justify-self:start}}
</style>
<script>
(function(){
  const settings=document.getElementById('page-settings'),homeEvidence=document.getElementById('evidenceStatus')?.closest('section');
  const card=document.createElement('section');card.id='sourceHealthCard';card.className='card pad sourceHealthCard';card.innerHTML='<div class="sectionhead"><div><h3>Source Health</h3><p>Your Concierge only claims current knowledge when its sources are actually synchronized.</p></div><span id="sourceHealthTag" class="tag warn">CHECKING</span></div><div id="sourceHealthGrid" class="sourceHealthGrid"><div class="empty">Checking connected sources…</div></div><div class="sourceHealthActions"><button class="btn secondary smallbtn" id="syncSourcesBtn">Sync now</button><button class="btn secondary smallbtn" onclick="setPage(\'settings\')">Manage sources</button></div><div class="sourceTruthRule"><b>Source-of-truth rule:</b> No successful sync = no claim of current mailbox knowledge. The original provider remains authoritative.</div>';
  if(homeEvidence)homeEvidence.parentNode.insertBefore(card,homeEvidence);else settings?.insertBefore(card,settings.querySelector('.settingsblock'));
  const form=document.getElementById('accountForm');
  if(form)form.onsubmit=async function(e){e.preventDefault();const payload={account_email:document.getElementById('accountEmail').value.trim(),provider:document.getElementById('accountProvider').value,label:document.getElementById('accountLabel').value.trim()};const r=await api('/api/email-accounts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok){toast(d.error||'Could not attach email account');return}if(d.requires_oauth&&d.account?.id){location=`/api/email-accounts/${d.account.id}/oauth/start`;return}form.reset();toast('Email source added');load()};
  window.connectAccount=id=>{location=`/api/email-accounts/${id}/oauth/start`};
  window.syncSources=async function(){const b=document.getElementById('syncSourcesBtn');if(b){b.disabled=true;b.textContent='Syncing…'}try{const r=await api('/api/source-sync/run',{method:'POST'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Sync failed');const created=(d.results||[]).reduce((n,x)=>n+Number(x.created||0),0);toast(created?`${created} new work item${created===1?'':'s'} found`:'Sources are up to date');await load()}catch(e){toast(e.message||'Could not sync sources')}finally{if(b){b.disabled=false;b.textContent='Sync now'}}};
  document.getElementById('syncSourcesBtn')?.addEventListener('click',window.syncSources);
  window.renderSourceHealth=async function(){try{const r=await api('/api/source-health',{cache:'no-store'}),d=await r.json();if(!r.ok)return;const rows=d.accounts||[],connected=rows.filter(a=>a.status==='connected'),bad=rows.filter(a=>['error','stale'].includes(a.health));const tag=document.getElementById('sourceHealthTag');if(tag){tag.textContent=bad.length?'ATTENTION':connected.length?'LIVE':'NOT CONNECTED';tag.className='tag '+(bad.length?'bad':connected.length?'good':'warn')};const grid=document.getElementById('sourceHealthGrid');if(grid)grid.innerHTML=rows.length?rows.map(a=>{const healthLabel={live:'Live',waiting:'Waiting for first sync',delayed:'Delayed',stale:'Stale',error:'Sync interrupted',not_connected:'Not connected'}[a.health]||a.health;const detail=a.last_sync_at?`Last successful sync ${when(a.last_sync_at)} · ${Number(a.messages_processed||0)} messages processed`:a.sync_error?esc(a.sync_error):'No successful sync yet';const action=a.status==='pending'?`<button class="btn smallbtn" onclick="connectAccount('${a.id}')">Authorize</button>`:a.status==='error'?`<button class="btn smallbtn" onclick="connectAccount('${a.id}')">Reconnect</button>`:'';return `<div class="sourceHealthRow"><div class="sourceHealthMain"><span class="sourceDot ${esc(a.health)}"></span><div><strong>${esc(a.account_email)}</strong><div class="small muted">${esc(a.provider==='gmail'?'Gmail / Google Workspace':a.provider==='outlook'?'Outlook / Microsoft 365':'Email')} · ${detail}</div>${a.sync_error?`<div class="small" style="color:#9d2d23">${esc(a.sync_error)}</div>`:''}</div></div><div>${action||`<span class="tag ${a.health==='live'?'good':['error','stale'].includes(a.health)?'bad':'warn'}">${esc(healthLabel.toUpperCase())}</span>`}</div></div>`}).join(''):'<div class="empty">No mailbox connected. Add Gmail or Outlook below to give the Concierge a live source of truth.</div>';
    if(typeof state==='object'){state.sourceHealth=d;const live=rows.filter(a=>a.health==='live').length,stale=rows.filter(a=>['stale','error'].includes(a.health)).length;if(document.getElementById('mailboxStatus'))document.getElementById('mailboxStatus').textContent=stale?'Mailbox sync needs attention':live?`${live} live mailbox${live===1?'':'es'} · source of truth current`:'Email source not live yet'}
  }catch(e){console.error('source health',e)}};
  const baseRenderAccounts=window.renderAccounts||renderAccounts;window.renderAccounts=renderAccounts=function(){baseRenderAccounts();const a=state.emailAccounts||[];document.getElementById('emailAccounts').innerHTML=a.length?a.map(x=>`<div class="accountcard"><div class="rowtop"><div><strong>${esc(x.account_email)}</strong><div class="small muted">${esc(x.label||x.provider)}${x.last_sync_at?' · synced '+esc(when(x.last_sync_at)):''}</div></div><span class="tag ${x.status==='connected'?'good':x.status==='pending'?'warn':'bad'}">${esc(x.status.toUpperCase())}</span></div><div class="actions">${x.status==='pending'?`<button class="btn smallbtn" onclick="connectAccount('${x.id}')">Authorize</button>`:''}${x.status==='error'?`<button class="btn smallbtn" onclick="connectAccount('${x.id}')">Reconnect</button>`:''}${x.status!=='disconnected'?`<button class="btn secondary smallbtn" onclick="disconnectAccount('${x.id}')">Disconnect</button>`:''}</div></div>`).join(''):'<div class="empty">No email account attached yet.</div>'};
  const baseLoad=window.load||load;window.load=load=async function(){await baseLoad();await renderSourceHealth()};
  const qs=new URLSearchParams(location.search);if(qs.get('source')==='connected')setTimeout(()=>toast('Mailbox connected and initial sync started'),250);if(qs.get('source_error'))setTimeout(()=>toast(qs.get('source_error')==='provider_not_configured'?'This email provider still needs administrator OAuth setup':'Mailbox authorization could not be completed'),250);
  setTimeout(renderSourceHealth,200);setInterval(()=>{if(document.visibilityState==='visible')window.syncSources()},120000);
})();
</script>
