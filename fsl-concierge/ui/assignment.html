<style>
.assignment-section{margin-top:17px}.assignment-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.assignment-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.assignment-card.overdue{border-color:#e9b9b4;background:#fffafa}.assignment-card h4{margin:0 0 4px}.assignment-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.assignment-note{margin-top:9px;padding:9px 10px;background:#f7fafb;border-left:3px solid #9dbbc7;border-radius:8px;color:#425a65}.assign-overlay{position:fixed;inset:0;background:rgba(7,25,35,.58);backdrop-filter:blur(8px);z-index:130;display:grid;place-items:center;padding:20px}.assign-overlay.hidden{display:none}.assign-modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(6,28,38,.3)}.assign-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.assign-body{padding:20px}.assign-form{display:grid;gap:13px}.assign-form .field input,.assign-form .field select,.assign-form .field textarea{width:100%;padding:10px 11px;border:1px solid var(--line-strong);border-radius:9px;background:#fff}.assign-form .field textarea{min-height:100px;resize:vertical}.assignment-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.assignment-tabs{display:flex;gap:6px}.assignment-tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-weight:800}.assignment-tabs button.active{background:#eaf4f8;border-color:#b9d5df;color:#0d5d7a}.assignment-timeline{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.assignment-event{padding:8px 0;border-top:1px solid #edf1f3}.assignment-event:first-child{border-top:0}@media(max-width:800px){.assignment-grid{grid-template-columns:1fr}}
</style>
<div id="assignOverlay" class="assign-overlay hidden"><div class="assign-modal"><div class="assign-head"><div><div class="eyebrow muted">Delegate work</div><h2 style="margin:3px 0 0">Assign task</h2></div><button id="assignClose" class="btn secondary smallbtn">Close</button></div><div class="assign-body"><form id="assignForm" class="assign-form"><input id="assignSourceItem" type="hidden"><div class="field"><label>Assign to</label><select id="assignPerson" required><option value="">Loading team…</option></select></div><div class="field"><label>Task</label><input id="assignTitle" required maxlength="220" placeholder="What needs to be done?"></div><div class="field"><label>Instructions / expected result</label><textarea id="assignInstructions" maxlength="4000" placeholder="Explain the deliverable, evidence to use, and what completion should look like."></textarea></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Due date</label><input id="assignDue" type="datetime-local"></div><div class="field"><label>Priority</label><select id="assignPriority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></div></div><div class="small muted">The assignee submits the work when finished. You verify completion before the task closes.</div><button class="btn" type="submit">Assign task</button></form></div></div></div>
<div id="assignmentDetailOverlay" class="assign-overlay hidden"><div class="assign-modal"><div class="assign-head"><div><div class="eyebrow muted">Delegated work</div><h2 id="assignmentDetailTitle" style="margin:3px 0 0">Task</h2></div><button id="assignmentDetailClose" class="btn secondary smallbtn">Close</button></div><div id="assignmentDetailBody" class="assign-body"></div></div></div>
<script>
let assignmentData=[],assignmentTeam=[],assignmentTab='sent';
const assignmentStatusLabel=s=>String(s||'assigned').replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase());
const assignmentOverdue=a=>a.due_at&&!['completed','cancelled'].includes(a.status)&&new Date(a.due_at)<new Date();
async function assignmentLoad(){
  try{const [ar,tr]=await Promise.all([api('/api/assignments',{cache:'no-store'}),api('/api/team',{cache:'no-store'})]);if(ar.ok)assignmentData=(await ar.json()).assignments||[];if(tr.ok)assignmentTeam=(await tr.json()).team||[];assignmentRender();}
  catch(e){if(e.message!=='auth')console.error('assignment load',e)}
}
function assignmentInstall(){
  const taskPage=$('page-tasks');if(!taskPage||$('delegatedWork'))return;
  const hero=taskPage.querySelector('.hero');if(hero){const btn=document.createElement('button');btn.className='btn secondary';btn.textContent='+ Assign new task';btn.onclick=()=>openAssign();hero.appendChild(btn)}
  const sec=document.createElement('section');sec.id='delegatedWork';sec.className='card pad assignment-section';sec.innerHTML=`<div class="sectionhead"><div><h3>Delegated work</h3><p>Assign, track, follow up, review and close work delegated between staff.</p></div><span id="assignmentTag" class="tag">0 open</span></div><div class="assignment-toolbar"><div class="assignment-tabs"><button id="assignmentSentTab" class="active" type="button">Assigned by me</button><button id="assignmentReceivedTab" type="button">Assigned to me</button></div><button class="btn secondary smallbtn" type="button" onclick="openAssign()">+ Assign task</button></div><div id="assignmentList" class="assignment-grid"><div class="empty">Loading delegated work…</div></div>`;
  taskPage.appendChild(sec);
  $('assignmentSentTab').onclick=()=>{assignmentTab='sent';assignmentRender()};$('assignmentReceivedTab').onclick=()=>{assignmentTab='received';assignmentRender()};
}
function assignmentRender(){
  assignmentInstall();if(!$('assignmentList'))return;
  const mine=assignmentData.filter(a=>a.direction===assignmentTab),open=assignmentData.filter(a=>!['completed','cancelled'].includes(a.status));
  $('assignmentTag').textContent=`${open.length} open`;$('assignmentTag').className='tag '+(open.length?'warn':'good');
  $('assignmentSentTab')?.classList.toggle('active',assignmentTab==='sent');$('assignmentReceivedTab')?.classList.toggle('active',assignmentTab==='received');
  $('assignmentList').innerHTML=mine.length?mine.map(a=>{const other=a.direction==='sent'?a.assignee:a.assigned_by,late=assignmentOverdue(a);return`<div class="assignment-card ${late?'overdue':''}"><div class="rowtop"><div><h4>${esc(a.title)}</h4><div class="small muted">${a.direction==='sent'?'Assigned to':'Assigned by'} ${esc(other?.full_name||other?.username||'Team member')}${other?.job_title?' · '+esc(other.job_title):''}</div></div><span class="tag ${a.status==='completed'?'good':late?'bad':a.status==='submitted'?'warn':''}">${late?'OVERDUE':esc(assignmentStatusLabel(a.status).toUpperCase())}</span></div>${a.instructions?`<div class="assignment-note">${esc(a.instructions)}</div>`:''}<div class="assignment-meta"><span class="tag">${esc(String(a.priority||'normal').toUpperCase())}</span>${a.due_at?`<span class="tag ${late?'bad':''}">Due ${esc(when(a.due_at))}</span>`:''}<span class="small muted">Updated ${esc(when(a.last_activity_at||a.updated_at))}</span></div><div class="actions"><button class="btn secondary smallbtn" onclick="openAssignmentDetail('${a.id}')">Open & track</button>${assignmentQuickActions(a)}</div></div>`}).join(''):`<div class="empty">${assignmentTab==='sent'?'You have not delegated any work yet.':'No work has been assigned to you yet.'}</div>`;
}
function assignmentQuickActions(a){
  if(a.direction==='received'){
    if(a.status==='assigned')return`<button class="btn smallbtn" onclick="assignmentAction('${a.id}','acknowledge')">Acknowledge</button>`;
    if(['acknowledged','changes_requested','blocked'].includes(a.status))return`<button class="btn smallbtn" onclick="assignmentAction('${a.id}','start')">Start work</button>`;
    if(a.status==='in_progress')return`<button class="btn smallbtn" onclick="assignmentAction('${a.id}','submit')">Submit for review</button>`;
  }else{
    if(a.status==='submitted')return`<button class="btn smallbtn" onclick="assignmentAction('${a.id}','approve')">Approve completion</button><button class="btn secondary smallbtn" onclick="assignmentAction('${a.id}','request_changes',true)">Request changes</button>`;
    if(!['completed','cancelled'].includes(a.status))return`<button class="btn secondary smallbtn" onclick="assignmentAction('${a.id}','follow_up',true)">Follow up</button>`;
  }
  return'';
}
function openAssign(itemId=''){
  assignmentInstall();$('assignSourceItem').value=itemId||'';const item=(state.items||[]).find(i=>i.id===itemId);$('assignTitle').value=item?.title||'';$('assignInstructions').value=item?`${item.summary||item.email_snippet||''}`:'';$('assignDue').value=item?.due_at?new Date(item.due_at).toISOString().slice(0,16):'';$('assignPriority').value='normal';$('assignPerson').innerHTML='<option value="">Choose a team member</option>'+assignmentTeam.map(p=>`<option value="${p.id}">${esc(p.full_name||p.username)}${p.job_title?' — '+esc(p.job_title):''}${p.organization?' · '+esc(p.organization):''}</option>`).join('');$('assignOverlay').classList.remove('hidden');document.body.style.overflow='hidden';
}
async function submitAssignment(e){e.preventDefault();const payload={assignee_user_id:$('assignPerson').value,title:$('assignTitle').value.trim(),instructions:$('assignInstructions').value.trim(),due_at:$('assignDue').value||null,priority:$('assignPriority').value,source_item_id:$('assignSourceItem').value||null};const r=await api('/api/assignments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok)return toast(d.error||'Could not assign task');$('assignOverlay').classList.add('hidden');document.body.style.overflow='';toast(`Assigned to ${d.assignee?.full_name||d.assignee?.username||'team member'}`);await assignmentLoad()}
async function assignmentAction(id,action,askNote=false){let note='';if(askNote){note=prompt(action==='follow_up'?'Follow-up message / note:':'What changes are required?','')||'';if(!note&&action!=='follow_up')return}if(action==='approve'&&!confirm('Approve this submission as completed?'))return;const r=await api(`/api/assignments/${id}/action`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,note})}),d=await r.json().catch(()=>({}));if(!r.ok)return toast(d.error||'Could not update task');toast(action==='approve'?'Task completed':action==='submit'?'Submitted for review':'Task updated');await assignmentLoad();if(!$('assignmentDetailOverlay').classList.contains('hidden'))await openAssignmentDetail(id)}
async function assignmentComment(id){const note=prompt('Add an update or comment:','');if(!note)return;const r=await api(`/api/assignments/${id}/comment`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({note})});if(!r.ok)return toast('Could not add update');toast('Update added');await openAssignmentDetail(id);await assignmentLoad()}
async function openAssignmentDetail(id){const r=await api(`/api/assignments/${id}`,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)return toast(d.error||'Could not open assignment');const a=d.assignment,events=d.events||[],mine=a.assignee_user_id===state.profile?.id,late=assignmentOverdue(a);$('assignmentDetailTitle').textContent=a.title;$('assignmentDetailBody').innerHTML=`<div class="rowtop"><div><b>${mine?'Assigned by':'Assigned to'} ${esc((mine?a.assigned_by:a.assignee)?.full_name||(mine?a.assigned_by:a.assignee)?.username||'Team member')}</b><div class="small muted">${a.due_at?'Due '+esc(when(a.due_at)):'No deadline set'} · ${esc(String(a.priority||'normal').toUpperCase())} priority</div></div><span class="tag ${a.status==='completed'?'good':late?'bad':''}">${late?'OVERDUE':esc(assignmentStatusLabel(a.status).toUpperCase())}</span></div>${a.instructions?`<div class="assignment-note">${esc(a.instructions)}</div>`:''}<div class="actions" style="margin-top:14px">${assignmentQuickActions({...a,direction:mine?'received':'sent'})}<button class="btn secondary smallbtn" onclick="assignmentComment('${a.id}')">Add update</button>${mine&&a.status==='in_progress'?`<button class="btn secondary smallbtn" onclick="assignmentAction('${a.id}','block',true)">Report blocker</button>`:''}</div><div class="assignment-timeline"><h3 style="font-size:15px;margin:0 0 6px">Activity & follow-up</h3>${events.length?events.map(e=>`<div class="assignment-event"><b>${esc(assignmentStatusLabel(e.event_type))}</b><div class="small muted">${esc(when(e.created_at))}</div>${e.note?`<div>${esc(e.note)}</div>`:''}</div>`).join(''):'<div class="empty">No activity yet.</div>'}</div>`;$('assignmentDetailOverlay').classList.remove('hidden');document.body.style.overflow='hidden'}
const __assignmentRenderWork=renderWork;
renderWork=function(){__assignmentRenderWork();const items=state.items||[],actions=items.filter(i=>i.status==='active'&&(i.needs_user??i.needs_hibo));const html=actions.length?actions.map(i=>{const p=typeof jevActiveProduct==='function'?jevActiveProduct(i.id):null,type=i.action_type||'draft_response',label=p?'Open work':((typeof jevActionLabels!=='undefined'&&jevActionLabels[type])||'Do the work');return`<div class="row"><div class="rowtop"><div><h4>${esc(i.title)}</h4><div>${esc(i.summary||'')}</div>${i.email_snippet?`<div class="email-snippet"><b>Email:</b> ${esc(i.email_snippet)}</div>`:''}<div class="source">Owner: ${esc(i.owner||'You')} · ${esc(when(i.received_at))}</div></div><div><span class="tag bad">ACTION</span><span class="tag worktype">${esc(type.replaceAll('_',' '))}</span></div></div><div class="actions">${sourceLink(i)}<button class="btn smallbtn" onclick="${p?`jevOpenProduct('${p.id}')`:`jevStartWork('${i.id}')`}">${esc(label)}</button><button class="btn secondary smallbtn" onclick="openAssign('${i.id}')">Assign</button></div></div>`}).join(''):'<div class="empty">Nothing needs your action right now.</div>';$('actions').innerHTML=html;if($('taskActions'))$('taskActions').innerHTML=html;assignmentRender()};
const __assignmentLoad=load;load=async function(){await __assignmentLoad();await assignmentLoad()};
$('assignClose').onclick=()=>{$('assignOverlay').classList.add('hidden');document.body.style.overflow=''};$('assignmentDetailClose').onclick=()=>{$('assignmentDetailOverlay').classList.add('hidden');document.body.style.overflow=''};$('assignForm').onsubmit=submitAssignment;
assignmentInstall();assignmentLoad();renderWork();
</script>
